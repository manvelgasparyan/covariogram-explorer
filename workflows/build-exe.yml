name: build Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build
        run: pyinstaller --onefile --windowed --name CovariogramExplorer --icon assets/icon.ico scripts/launch_explorer.py
      - name: Smoke test
        shell: pwsh
        run: |
          Start-Process -FilePath .\dist\CovariogramExplorer.exe -ArgumentList "--shape", "annulus", "--save", "smoke-test.png" -Wait
          if (!(Test-Path smoke-test.png)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: CovariogramExplorer-windows
          path: dist/CovariogramExplorer.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CovariogramExplorer.exe
